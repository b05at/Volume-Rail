name: APK bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        run: gradle :app:assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Volume-Rail.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Volume-Rail
          path: Volume-Rail.apk

      - name: Version auslesen
        id: ver
        run: echo "name=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      # Bei jedem Push auf main: Release v<versionName> anlegen bzw. APK darin ersetzen
      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Volume-Rail ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: |
            Volume-Rail ${{ steps.ver.outputs.name }} – feinere Lautstärkestufen für das Sonoff NSPanel Pro.
            Installieren: `adb install -r Volume-Rail.apk`
          files: Volume-Rail.apk
